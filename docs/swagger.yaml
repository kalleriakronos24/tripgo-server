  /car-management/create:
    post:
      consumes:
      - application/json
      description: A POST Request to create a car and assigned to the driver whose
        creating it
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      - in: formData
        name: carManagementType
        required: true
        type: string
      - in: formData
        name: carModelId
        required: true
        type: string
      - in: formData
        name: driverID
        type: string
      - in: formData
        name: licensePhoto
        type: string
      - in: formData
        name: name
        required: true
        type: string
      - in: formData
        name: plateNumber
        required: true
        type: string
      - description: front car photo upload
        in: formData
        name: frontCarPhoto
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Method to create or assign a car to the driver
      tags:
      - Car Management
  /web/statistic/customer:
    get:
      consumes:
      - application/json
      description: A GET Request to fetch count how many bookings are made by customer
        either transfer, tour or delivery
      parameters:
      - default: Bearer <Add access token here>
