  /auth/signin:
    post:
      consumes:
      - application/json
      description: A Global authentication sign-in method for all microservices
      parameters:
      - description: global login
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
