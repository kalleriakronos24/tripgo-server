  /booking/transfer:
    post:
      consumes:
      - application/json
      description: A POST Request to create a new record for costumer to make a new
        Transfer booking to the driver
      parameters:
      - description: insert booking transfer
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.InsertBookingTransfer'
      produces:
      - application/json
      responses:
        "200":
          description: OK
