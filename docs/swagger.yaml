        type: integer
      addPickupPoint:
        type: integer
      adultSeater:
        type: integer
      carModelId:
        type: string
      childSeater:
        type: integer
      fromLatCoordinate:
        type: number
      fromLngCoordinate:
        type: number
      fromLocation:
        type: string
      grandTotal:
        type: number
      id:
        type: string
      passengerNotes:
        type: string
      pickUpDate:
        type: string
      price:
        type: number
      toLatCoordinate:
        type: number
      toLngCoordinate:
        type: number
      toLocation:
        type: string
      totalDistance:
        type: number
    type: object
  dto.InsertBookingTransferRating:
    properties:
      bookingTransferAssignedID:
        type: string
      carManagementId:
        type: string
      customerId:
        type: string
      rating:
        type: integer
    type: object
  dto.Response:
    properties:
      code:
        type: integer
      data: {}
      error: {}
      kind:
        type: string
      message:
        type: string
    type: object
  dto.UserLogin:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.UserSignup:
    properties:
      address:
        type: string
      createdBy:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
