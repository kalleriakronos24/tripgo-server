definitions:
  dto.CreatePaymentIntentValidator:
    properties:
      amount:
        type: integer
      currency:
        type: string
    required:
    - amount
    - currency
    type: object
  dto.CredentialSignInDto:
    properties:
      deviceToken:
        type: string
      email:
        type: string
      password:
        type: string
      type:
        type: string
    required:
    - email
    - password
    type: object
  dto.CustomerSignup:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      refferalCode:
        type: string
      type:
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.DriverSignUpValidator:
    properties:
      driverType:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      plateNumber:
        type: string
    required:
    - driverType
    - email
    - name
    - password
    - phone
    - plateNumber
    type: object
  dto.DriverSignup:
    type: object
  dto.InsertBookingTransfer:
    properties:
      addDropoffPoint:
        type: integer
      addPickupPoint:
        type: integer
      adultSeater:
        type: integer
      carModelId:
        type: string
      childSeater:
        type: integer
      fromLatCoordinate:
        type: number
      fromLngCoordinate:
        type: number
      fromLocation:
        type: string
      grandTotal:
        type: number
      id:
        type: string
      passengerNotes:
        type: string
      pickUpDate:
        type: string
      price:
        type: number
      refferalCode:
        type: string
      toLatCoordinate:
        type: number
      toLngCoordinate:
        type: number
      toLocation:
        type: string
      totalDistance:
        type: number
    type: object
  dto.InsertBookingTransferRating:
    properties:
      bookingTransferAssignedID:
        type: string
      carManagementId:
        type: string
      customerId:
        type: string
      rating:
        type: integer
    type: object
  dto.InsertCarManagement:
    properties:
      carManagementType:
        description: |-
          FrontCarPhoto     *multipart.FileHeader
          LicensePhoto      *multipart.FileHeader
          RoadTaxPhoto      *multipart.FileHeader
           VEPPhoto          *multipart.FileHeader
        type: string
      carModelID:
        type: string
      driverID:
        type: string
      name:
        type: string
      plateNumber:
        type: string
    type: object
  dto.Response:
    properties:
      code:
        type: integer
      data: {}
      error: {}
      kind:
        type: string
      message:
        type: string
    type: object
  dto.UserLogin:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.UserSignup:
    properties:
      address:
        type: string
      createdBy:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
  dto.ValidatorUpdateDriverTopupHistory:
    properties:
      amount:
        type: number
      driverId:
        type: string
      driverTopupId:
        type: string
      status:
        type: string
    required:
    - amount
    - driverId
    - driverTopupId
    - status
    type: object
