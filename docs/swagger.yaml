        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.UserSignup'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Internal Sign-Up
      tags:
      - Authentication - Internal
  /booking-assigned/transfer:
    get:
      consumes:
      - application/json
      description: A GET Request to fetch a all records for driver to view booking
        transfer that assigned and whose are not accepted by the driver
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
      summary: List Booking Transfer Assigned
      tags:
      - Booking Assgined - Transfer
  /booking-assigned/transfer/accept:
    get:
